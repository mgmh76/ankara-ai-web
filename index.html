<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16253a">
<title>ANKARA AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--brand:#16253a;--accent:#246bfe;--red:#c7362f;--yellow:#b77908;--green:#1f7a4d;--shadow:0 8px 24px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0f1d2f,#29496e)}.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.24)}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900}.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.login h1{font-size:27px;margin:26px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.field{margin-top:15px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--accent);color:#fff}.login .primary{width:100%;margin-top:18px}.ghost{background:#fff;border:1px solid var(--line)}.msg{min-height:18px;margin-top:10px;font-size:11px;color:var(--red)}.shell{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--brand);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.sidebar .logo{background:#fff;color:var(--brand)}.nav{margin-top:28px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce5f0;padding:12px;border-radius:12px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;color:#b9c5d5;font-size:10px;line-height:1.5}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.userinfo{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#243a58;color:#fff;font-weight:900;font-size:11px}.small{font-size:10px;color:var(--muted)}.content{max-width:1160px;margin:auto;padding:26px}.eye{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h2{font-size:30px;margin:5px 0}.status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#edf8f2;font-size:10px;font-weight:800;color:var(--green);margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:19px 0}.stat,.card,.project{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase}.grid{display:grid;gap:15px}.two{grid-template-columns:1.1fr .9fr}.cardhead,.ptop{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:11px}.cardtitle{font-size:14px;font-weight:900}.link{border:0;background:transparent;color:var(--accent);font-size:10px;font-weight:800}.pname{font-weight:900;font-size:15px}.meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900}.red{background:#fff0ef;color:var(--red)}.yellow{background:#fff8e8;color:#805d0b}.green{background:#edf8f2;color:var(--green)}.gray{background:#f2f4f7;color:#667085}.priority{display:flex;gap:9px;padding:11px 0;border-top:1px solid var(--line)}.priority:first-of-type{border-top:0}.sig{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto}.sig.red{background:var(--red)}.sig.yellow{background:var(--yellow)}.sig.green{background:var(--green)}.p-title{font-size:12px;font-weight:850}.p-meta{font-size:10px;color:var(--muted);margin-top:3px}.money{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.money>div{background:#f8fafc;border-radius:12px;padding:11px}.money b{font-size:14px}.money span{display:block;font-size:8px;color:var(--muted);margin-top:3px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:700px;background:#fff}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}.table th{background:#f8fafc;color:var(--muted);font-size:8px;text-transform:uppercase}.search{margin:15px 0}.search input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}.detail{background:linear-gradient(135deg,var(--brand),#29496e);color:#fff;border-radius:19px;padding:18px}.detail h3{font-size:21px;margin:8px 0 4px}.detail .meta{color:#dce6f2}.empty,.loading{padding:25px;text-align:center;color:var(--muted);font-size:11px}.mobilebrand{display:none}@media(max-width:820px){.sidebar{display:none}.main{margin-left:0;width:100%}.top{padding:0 13px}.content{padding:17px}.mobilebrand{display:flex;align-items:center;gap:8px;font-weight:900}.mobilebrand .logo{width:32px;height:32px;border-radius:10px}.desktopbrand{display:none}.stats,.money{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}h2{font-size:25px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">A</div>ANKARA AI</div><h1>Iniciar sesión</h1><div class="sub">Sistema Inteligente de Gestión Administrativa</div><form id="loginForm"><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" required value="memartinezherrera@gmail.com"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn primary">Ingresar</button><div id="msg" class="msg"></div></form></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><div class="logo">A</div>ANKARA AI</div><div class="nav"><button data-page="dashboard" class="active">⌂ &nbsp; Inicio</button><button data-page="projects">▣ &nbsp; Proyectos</button><button data-page="alerts">⚠ &nbsp; Alertas</button><button data-page="documents">▤ &nbsp; Documentos</button><button data-page="finances">₲ &nbsp; Finanzas</button></div><div class="sidefoot">MVP conectado a Supabase<br>Acceso protegido por RLS</div></aside><main class="main"><div class="top"><div class="desktopbrand small">CORPORACIÓN ANKARA S.A.</div><div class="mobilebrand"><div class="logo">A</div>ANKARA AI</div><div class="userinfo"><div><div id="userName" style="font-size:11px;font-weight:850;text-align:right"></div><div id="userRole" class="small" style="text-align:right"></div></div><div class="avatar">MM</div><button id="logout" class="btn ghost">Salir</button></div></div><div id="page" class="content"><div class="loading">Cargando ANKARA AI…</div></div></main></div>
<script>
const URL='https://jtdbajsrvyjxfhbdorek.supabase.co',KEY='sb_publishable_aRDGC97_YivT8Y_IGpTgYQ_e7aMG6Cq';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let S={page:'dashboard',profile:null,projects:[],alerts:[],docs:[],tx:[],bonds:[],selected:null};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('es-GT',{style:'currency',currency:'GTQ',maximumFractionDigits:2}).format(Number(v||0));
function sev(v=''){v=String(v).toUpperCase();if(v.includes('CRIT')||v==='ALTO')return'red';if(v.includes('MED')||v.includes('ATENC')||v==='AMARILLO')return'yellow';if(v.includes('BAJO')||v==='VERDE')return'green';return'gray'}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}
async function profile(authId){const r=await sb.from('users').select('id,name,email,status').eq('auth_user_id',authId).single();if(r.error)throw r.error;const rr=await sb.from('user_roles').select('roles(name)').eq('user_id',r.data.id).limit(1);r.data.role=rr.data?.[0]?.roles?.name||'Usuario';return r.data}
async function load(){const rs=await Promise.all([sb.from('vw_project_summary').select('*').order('project_code'),sb.from('vw_alert_center').select('*').order('due_at',{ascending:true,nullsFirst:false}),sb.from('documents').select('id,title,document_type,reference_number,document_date,evidence_status,classification_status,project_id,external_url').order('created_at',{ascending:false}).limit(50),sb.from('financial_transactions').select('id,project_id,transaction_date,direction,nature,counterparty_name,reference,amount,support_level,evidence_status').order('transaction_date',{ascending:false}).limit(50),sb.from('bonds').select('id,project_id,bond_type,policy_number,issuer,insured_amount,validity_start,validity_end,status,endorsement_status,is_future_requirement,currently_required,evidence_status')]);S.projects=rs[0].data||[];S.alerts=rs[1].data||[];S.docs=rs[2].data||[];S.tx=rs[3].data||[];S.bonds=rs[4].data||[];rs.forEach(r=>{if(r.error)console.warn(r.error)})}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}try{S.profile=await profile(session.user.id);await load();$('#userName').textContent=S.profile.name||session.user.email;$('#userRole').textContent=S.profile.role;showApp();render()}catch(e){console.error(e);await sb.auth.signOut();showLogin();$('#msg').textContent='La cuenta existe, pero no tiene acceso interno habilitado.'}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#msg').textContent='';$('#loginBtn').disabled=true;$('#loginBtn').textContent='Ingresando…';const r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;$('#loginBtn').textContent='Ingresar';if(r.error){$('#msg').textContent='No fue posible iniciar sesión: '+r.error.message;return}await boot()});$('#logout').onclick=async()=>{await sb.auth.signOut();showLogin()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;S.selected=null;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function pById(id){return S.projects.find(p=>p.id===id)}
function pCard(p){return `<div class="project" onclick="openProject('${esc(p.project_code)}')" style="cursor:pointer"><div class="ptop"><div><div class="pname">${esc(p.name)}</div><div class="meta">${esc(p.project_code)}${p.nog?' · NOG '+esc(p.nog):''}</div></div><span class="badge ${sev(p.risk_level)}">${esc(p.risk_level||p.status)}</span></div><div class="meta">${esc(p.status)}</div><div class="money"><div><b>${money(p.contract_amount)}</b><span>Contrato</span></div><div><b>${money(p.advance_remaining)}</b><span>Saldo anticipo</span></div><div><b>${p.open_tasks||0}</b><span>Pendientes</span></div><div><b>${p.open_findings||0}</b><span>Hallazgos</span></div></div></div>`}
function dash(){const cr=S.alerts.filter(a=>sev(a.severity)==='red').length,wa=S.alerts.filter(a=>sev(a.severity)==='yellow').length,p=S.projects[0];return `<div class="eye">Centro de operaciones</div><h2>Estado general</h2><div class="sub">Información obtenida desde PostgreSQL/Supabase con tu sesión autenticada.</div><div class="status"><span class="dot"></span>Sistema conectado y protegido</div><div class="stats"><div class="stat"><b style="color:var(--red)">${cr}</b><span>Críticos</span></div><div class="stat"><b style="color:var(--yellow)">${wa}</b><span>Atención</span></div><div class="stat"><b>${S.projects.length}</b><span>Proyectos</span></div><div class="stat"><b>${S.docs.length}</b><span>Documentos</span></div></div><div class="grid two"><div class="card"><div class="cardhead"><div class="cardtitle">Prioridades</div><button class="link" onclick="go('alerts')">Ver todas</button></div>${S.alerts.slice(0,6).map(a=>`<div class="priority"><span class="sig ${sev(a.severity)}"></span><div><div class="p-title">${esc(a.title)}</div><div class="p-meta">${esc(a.source_type)}</div></div></div>`).join('')||'<div class="empty">Sin alertas abiertas.</div>'}</div><div class="card"><div class="cardhead"><div class="cardtitle">Proyecto piloto</div><button class="link" onclick="go('projects')">Cartera</button></div>${p?pCard(p):'<div class="empty">Sin proyectos visibles.</div>'}</div></div>`}
function projects(){return `<div class="eye">Cartera</div><h2>Proyectos</h2><div class="search"><input id="ps" placeholder="Buscar proyecto, código o NOG…" oninput="filterP()"></div><div id="plist" class="grid">${S.projects.map(pCard).join('')||'<div class="card empty">Sin proyectos visibles.</div>'}</div>`}
function alerts(){return `<div class="eye">Centro de control</div><h2>Alertas y pendientes</h2><div class="grid" style="margin-top:17px">${S.alerts.map(a=>`<div class="card"><div class="cardhead"><div class="cardtitle">${esc(a.title)}</div><span class="badge ${sev(a.severity)}">${esc(a.severity||a.source_type)}</span></div><div class="meta">${esc(a.source_type)}${a.due_at?' · '+new Date(a.due_at).toLocaleString('es-GT'):''}</div></div>`).join('')||'<div class="card empty">Sin alertas.</div>'}</div>`}
function docs(){return `<div class="eye">Expediente digital</div><h2>Documentos</h2><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Documento</th><th>Tipo</th><th>Referencia</th><th>Fecha</th><th>Evidencia</th></tr></thead><tbody>${S.docs.map(d=>`<tr><td>${d.external_url?`<a href="${esc(d.external_url)}" target="_blank">${esc(d.title)}</a>`:esc(d.title)}</td><td>${esc(d.document_type||'—')}</td><td>${esc(d.reference_number||'—')}</td><td>${esc(d.document_date||'—')}</td><td><span class="badge ${d.evidence_status==='DOCUMENTADO'?'green':'yellow'}">${esc(d.evidence_status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Sin documentos.</td></tr>'}</tbody></table></div></div>`}
function finances(){const i=S.tx.filter(t=>t.direction==='INFLOW').reduce((s,t)=>s+Number(t.amount||0),0),o=S.tx.filter(t=>t.direction==='OUTFLOW'&&t.support_level==='DOCUMENTADO').reduce((s,t)=>s+Number(t.amount||0),0),u=S.tx.filter(t=>t.direction==='OUTFLOW'&&t.support_level==='INFORMADO_SIN_SOPORTE').reduce((s,t)=>s+Number(t.amount||0),0);return `<div class="eye">Control financiero</div><h2>Finanzas</h2><div class="stats"><div class="stat"><b>${money(i)}</b><span>Ingresos</span></div><div class="stat"><b>${money(o)}</b><span>Egresos documentados</span></div><div class="stat"><b>${money(u)}</b><span>Sin soporte</span></div><div class="stat"><b>${S.tx.length}</b><span>Movimientos</span></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Proyecto</th><th>Dirección</th><th>Naturaleza</th><th>Contraparte</th><th>Monto</th><th>Soporte</th></tr></thead><tbody>${S.tx.map(t=>`<tr><td>${esc(t.transaction_date||'—')}</td><td>${esc(pById(t.project_id)?.project_code||'—')}</td><td>${esc(t.direction)}</td><td>${esc(t.nature)}</td><td>${esc(t.counterparty_name||'—')}</td><td>${money(t.amount)}</td><td>${esc(t.support_level)}</td></tr>`).join('')||'<tr><td colspan="7">Sin movimientos.</td></tr>'}</tbody></table></div></div>`}
function detail(p){const as=S.alerts.filter(a=>a.project_id===p.id),bs=S.bonds.filter(b=>b.project_id===p.id);return `<div class="eye">Proyecto</div><h2>${esc(p.project_code)}</h2><div class="detail"><span class="badge red">${esc(p.risk_level||'CONTROL')}</span><h3>${esc(p.name)}</h3><div class="meta">${esc(p.contracting_entity||'')}${p.nog?' · NOG '+esc(p.nog):''}</div><div style="font-size:22px;font-weight:900;margin-top:12px">${money(p.contract_amount)}</div></div><div class="grid two" style="margin-top:15px"><div class="card"><div class="cardtitle">Estado financiero</div><div class="money"><div><b>${money(p.documented_inflows)}</b><span>Ingreso documentado</span></div><div><b>${money(p.documented_outflows)}</b><span>Egreso documentado</span></div><div><b>${money(p.unsupported_reported_outflows)}</b><span>Sin soporte</span></div><div><b>${money(p.advance_remaining)}</b><span>Saldo anticipo</span></div></div></div><div class="card"><div class="cardtitle">Alertas</div>${as.map(a=>`<div class="priority"><span class="sig ${sev(a.severity)}"></span><div><div class="p-title">${esc(a.title)}</div></div></div>`).join('')||'<div class="empty">Sin alertas.</div>'}<div class="cardtitle" style="margin-top:12px">Fianzas</div>${bs.map(b=>`<div class="priority"><span class="sig yellow"></span><div><div class="p-title">${esc(b.bond_type)}${b.policy_number?' · '+esc(b.policy_number):''}</div><div class="p-meta">${esc(b.status||'—')}</div></div></div>`).join('')||'<div class="empty">Sin fianzas.</div>'}</div></div>`}
function render(){$('#page').innerHTML=S.selected?detail(S.selected):S.page==='dashboard'?dash():S.page==='projects'?projects():S.page==='alerts'?alerts():S.page==='documents'?docs():finances()}
window.go=p=>{S.page=p;S.selected=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};window.openProject=code=>{S.selected=S.projects.find(p=>p.project_code===code)||null;render()};window.filterP=()=>{const q=($('#ps')?.value||'').toLowerCase();document.querySelectorAll('#plist .project').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'block':'none')};boot();
</script>
</body></html>
